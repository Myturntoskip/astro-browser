<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Astro</title>
  <style>
    :root {
      --bg-main: #1e1e1e;
      --bg-nav: #2d2d2d;
      --bg-input: #3c3c3c;
      --bg-btn: #3c3c3c;
      --bg-btn-hover: #4e4e4e;
      --bg-sidebar: #252526;
      --text-color: white;
      --border-color: #3c3c3c;
      --input-border: #444;
      --bg-tab-active: #1e1e1e;
      --bg-tab-inactive: #2d2d2d;
    }

    body.light-mode {
      --bg-main: #f0f2f5;
      --bg-nav: #ffffff;
      --bg-input: #f0f2f5;
      --bg-btn: #e4e6eb;
      --bg-btn-hover: #d8dadf;
      --bg-sidebar: #ffffff;
      --text-color: #1c1e21;
      --border-color: #e4e6eb;
      --input-border: #ccd0d5;
      --bg-tab-active: #f0f2f5;
      --bg-tab-inactive: #e4e6eb;
    }

    body, html { 
      margin: 0; padding: 0; width: 100%; height: 100%; 
      display: flex; font-family: sans-serif; 
      background: var(--bg-main); overflow: hidden; transition: background 0.3s;
    }
    
    .main-container { flex: 1; display: flex; flex-direction: column; height: 100%; width: 100%; }
    .tabs-bar { display: flex; background: var(--bg-nav); padding: 5px 10px 0 10px; gap: 5px; align-items: flex-end; border-bottom: 1px solid var(--border-color); }
    
    .tab {
      background: var(--bg-tab-inactive); color: var(--text-color); padding: 8px 15px;
      border-radius: 8px 8px 0 0; font-size: 13px; cursor: pointer; display: flex;
      align-items: center; gap: 8px; max-width: 150px; min-width: 80px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid var(--border-color); border-bottom: none;
    }

    .tab.active { background: var(--bg-tab-active); font-weight: bold; border-bottom: 1px solid var(--bg-tab-active); margin-bottom: -1px; z-index: 2; }
    .tab .close-tab { font-weight: bold; cursor: pointer; opacity: 0.5; }
    .tab .close-tab:hover { opacity: 1; }
    .add-tab-btn { padding: 6px 12px; margin-bottom: 5px; }

    .nav-bar { display: flex; padding: 10px; background: var(--bg-nav); gap: 8px; align-items: center; border-bottom: 1px solid var(--border-color); }
    .nav-bar input { flex: 1; padding: 8px 14px; border-radius: 20px; border: 1px solid var(--input-border); background: var(--bg-input); color: var(--text-color); outline: none; font-size: 14px; }
    .nav-bar input:focus { border-color: #007acc; background: var(--bg-btn-hover); }
    
    .btn { padding: 8px 14px; background: var(--bg-btn); color: var(--text-color); border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s, color 0.2s; display: flex; align-items: center; justify-content: center; }
    .btn:hover { background: var(--bg-btn-hover); }
    .btn:disabled { opacity: 0.2; cursor: not-allowed; }
    
    .webviews-container { flex: 1; position: relative; width: 100%; height: 100%; }
    webview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; visibility: hidden; }
    webview.active { visibility: visible; }

    .sidebar { width: 0; background: var(--bg-sidebar); border-left: 0 solid var(--border-color); display: flex; flex-direction: column; transition: width 0.3s ease, border-left 0.3s ease; overflow: hidden; color: var(--text-color); height: 100%; }
    .sidebar.open { width: 280px; border-left: 1px solid var(--border-color); }
    .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border-color); font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .sidebar-content { padding: 15px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    
    .list-section h3 { margin: 0 0 8px 0; font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .item-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 5px; }
    .item-list li { padding: 6px 10px; background: var(--bg-btn); border-radius: 4px; font-size: 13px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background 0.2s; }
    .item-list li:hover { background: var(--bg-btn-hover); color: #007acc; }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="tabs-bar" id="tabs-bar">
      <button id="add-tab-btn" class="btn add-tab-btn" title="Nova Aba">+</button>
    </div>

    <div class="nav-bar">
      <button id="back-btn" class="btn" disabled>&larr;</button>
      <button id="forward-btn" class="btn" disabled>&rarr;</button>
      <button id="reload-btn" class="btn">&#x21BB;</button>
      <input type="text" id="url-input" value="" placeholder="Digite o URL ou pesquise no Google...">
      <button id="go-btn" class="btn" style="background: #007acc; color: white;">Ir</button>
      <button id="theme-btn" class="btn" title="Alternar Tema">☼</button>
      <button id="fav-btn" class="btn" title="Adicionar aos Favoritos">☆</button>
      <button id="menu-btn" class="btn" title="Histórico e Favoritos">☰</button>
    </div>
    <div class="webviews-container" id="webviews-container"></div>
  </div>

  <div id="sidebar" class="sidebar">
    <div class="sidebar-header"><span>Painel Astro</span><button id="close-sidebar-btn" class="btn" style="padding: 4px 8px;">&times;</button></div>
    <div class="sidebar-content">
      <div class="list-section"><h3>Favoritos</h3><ul id="favorites-list" class="item-list"></ul></div>
      <div class="list-section"><h3>Histórico</h3><ul id="history-list" class="item-list"></ul></div>
    </div>
  </div>
  <script>
    const tabsBar = document.getElementById('tabs-bar');
    const addTabBtn = document.getElementById('add-tab-btn');
    const webviewsContainer = document.getElementById('webviews-container');
    const urlInput = document.getElementById('url-input');
    const goBtn = document.getElementById('go-btn');
    const backBtn = document.getElementById('back-btn');
    const forwardBtn = document.getElementById('forward-btn');
    const reloadBtn = document.getElementById('reload-btn');
    const themeBtn = document.getElementById('theme-btn');
    const favBtn = document.getElementById('fav-btn');
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');
    const closeSidebarBtn = document.getElementById('close-sidebar-btn');
    const favoritesList = document.getElementById('favorites-list');
    const historyList = document.getElementById('history-list');

    let bookmarks = JSON.parse(localStorage.getItem('astro_bookmarks')) || [];
    let historyData = JSON.parse(localStorage.getItem('astro_history')) || [];
    let tabs = [];
    let activeTabId = null;

    let currentTheme = localStorage.getItem('astro_theme') || 'dark';
    if (currentTheme === 'light') { document.body.classList.add('light-mode'); themeBtn.innerHTML = '☾'; }
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      if (document.body.classList.contains('light-mode')) { localStorage.setItem('astro_theme', 'light'); themeBtn.innerHTML = '☾'; }
      else { localStorage.setItem('astro_theme', 'dark'); themeBtn.innerHTML = '☼'; }
    });

    function processUrl(input) {
      let query = input.trim();
      if (!query) return `file://${__dirname}/newtab.html`;
      
      if (query.startsWith('http://') || query.startsWith('https://')) {
        return query;
      }
      if (query.includes('.') && !query.includes(' ')) {
        return 'https://' + query;
      }
      return 'https://google.com/search?q=' + encodeURIComponent(query);
    }

    function navigate() {
      const activeTab = tabs.find(t => t.id === activeTabId);
      if (activeTab) activeTab.webviewEl.loadURL(processUrl(urlInput.value));
    }

    function createTab(url = 'newtab.html') {
      const id = Date.now() + Math.random().toString(36).substr(2, 5);
      const tabEl = document.createElement('div');
      tabEl.className = 'tab';
      tabEl.id = `tab-${id}`;
      tabEl.innerHTML = `<span class="tab-title">Nova Aba</span><span class="close-tab">&times;</span>`;
      tabsBar.insertBefore(tabEl, addTabBtn);

      const webviewEl = document.createElement('webview');
      webviewEl.id = `webview-${id}`;
      webviewEl.src = url === 'newtab.html' ? `file://${__dirname}/newtab.html` : url;
      webviewsContainer.appendChild(webviewEl);

      const tabObj = { id, tabEl, webviewEl };
      tabs.push(tabObj);
      setupWebviewEvents(tabObj);

      tabEl.addEventListener('click', (e) => {
        if (e.target.className === 'close-tab') closeTab(id);
        else switchTab(id);
      });
      switchTab(id);
    }

    function switchTab(id) {
      activeTabId = id;
      tabs.forEach(t => {
        if (t.id === id) {
          t.tabEl.classList.add('active'); t.webviewEl.classList.add('active');
          const currentUrl = t.webviewEl.getURL();
          urlInput.value = currentUrl.includes('newtab.html') ? '' : currentUrl;
          updateNavigationButtons(t.webviewEl);
        } else {
          t.tabEl.classList.remove('active'); t.webviewEl.classList.remove('active');
        }
      });
    }

    function closeTab(id) {
      const index = tabs.findIndex(t => t.id === id);
      if (index === -1) return;
      tabs[index].tabEl.remove(); tabs[index].webviewEl.remove(); tabs.splice(index, 1);
      if (activeTabId === id && tabs.length > 0) switchTab(tabs[index === 0 ? 0 : index - 1].id);
      else if (tabs.length === 0) createTab();
    }

    function updateNavigationButtons(wv) {
      try {
        backBtn.disabled = !wv.canGoBack(); forwardBtn.disabled = !wv.canGoForward();
        const currentUrl = wv.getURL();
        if (bookmarks.includes(currentUrl) && !currentUrl.includes('newtab.html')) { favBtn.innerHTML = '★'; favBtn.style.color = '#ffcc00'; }
        else { favBtn.innerHTML = '☆'; favBtn.style.color = ''; }
      } catch(e) {}
    }

    function setupWebviewEvents(tabObj) {
      const wv = tabObj.webviewEl;
      const tabTitleEl = tabObj.tabEl.querySelector('.tab-title');
      wv.addEventListener('page-title-updated', (e) => { tabTitleEl.textContent = e.title; });

      function onNavigate() {
        const currentUrl = wv.getURL();
        if (tabObj.id === activeTabId) { 
          urlInput.value = currentUrl.includes('newtab.html') ? '' : currentUrl; 
          updateNavigationButtons(wv); 
        }
        if (currentUrl !== 'about:blank' && !currentUrl.includes('newtab.html') && historyData !== currentUrl) {
          historyData.unshift(currentUrl); if (historyData.length > 50) historyData.pop();
          localStorage.setItem('astro_history', JSON.stringify(historyData)); renderLists();
        }
      }
      wv.addEventListener('did-navigate', onNavigate);
      wv.addEventListener('did-navigate-in-page', onNavigate);
    }

    goBtn.addEventListener('click', navigate);
    urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') navigate(); });
    addTabBtn.addEventListener('click', () => createTab());
    backBtn.addEventListener('click', () => { const t = tabs.find(x => x.id === activeTabId); if (t && t.webviewEl.canGoBack()) t.webviewEl.goBack(); });
    forwardBtn.addEventListener('click', () => { const t = tabs.find(x => x.id === activeTabId); if (t && t.webviewEl.canGoForward()) t.webviewEl.goForward(); });
    reloadBtn.addEventListener('click', () => { const t = tabs.find(x => x.id === activeTabId); if (t) t.webviewEl.reload(); });

    favBtn.addEventListener('click', () => {
      const t = tabs.find(x => x.id === activeTabId); if (!t) return;
      const currentUrl = t.webviewEl.getURL(); if (currentUrl.includes('newtab.html')) return;
      const index = bookmarks.indexOf(currentUrl);
      if (index === -1) bookmarks.push(currentUrl); else bookmarks.splice(index, 1);
      localStorage.setItem('astro_bookmarks', JSON.stringify(bookmarks)); updateNavigationButtons(t.webviewEl); renderLists();
    });

    menuBtn.addEventListener('click', () => { sidebar.classList.toggle('open'); renderLists(); });
    closeSidebarBtn.addEventListener('click', () => { sidebar.classList.remove('open'); });

    function renderLists() {
      favoritesList.innerHTML = ''; historyList.innerHTML = '';
      bookmarks.forEach(url => {
        const li = document.createElement('li'); li.textContent = url; li.title = url;
        li.addEventListener('click', () => { const t = tabs.find(x => x.id === activeTabId); if (t) t.webviewEl.loadURL(url); });
        favoritesList.appendChild(li);
      });
      historyData.forEach(url => {
        const li = document.createElement('li'); li.textContent = url; li.title = url;
        li.addEventListener('click', () => { const t = tabs.find(x => x.id === activeTabId); if (t) t.webviewEl.loadURL(url); });
        historyList.appendChild(li);
      });
    }

    createTab();
    renderLists();
  </script>
</body>
</html>
